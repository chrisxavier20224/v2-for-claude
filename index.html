<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>html, body { background-color: #ffffff; }</style>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />

    <!-- Primary Meta Tags -->
    <title>Integra Networks — Business-Grade Connectivity Without Fibre</title>
    <meta name="description" content="Integra Networks delivers fast, reliable internet where fibre can&#39;t reach. SD-WAN, Starlink, leased lines, business WiFi, and managed connectivity — live in 14 days.">
    <meta name="author" content="Integra Networks" />
    <meta name="robots" content="index, follow" />
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.hsforms.net https://www.googletagmanager.com https://www.google-analytics.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://api.ideal-postcodes.co.uk https://cdn.gpteng.co https://cdn.jsdelivr.net https://static.hsappstatic.net https://*.clarity.ms https://*.google.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; img-src 'self' data: blob: https: http:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https: wss:; frame-src 'self' https://app.hubspot.com https://meetings.hubspot.com https://www.googleadservices.com https://td.doubleclick.net https://googleads.g.doubleclick.net; media-src 'self' https:; object-src 'none'; base-uri 'self'">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://integra-networks.co.uk" />
    <meta property="og:title" content="Integra Networks — Business-Grade Connectivity Without Fibre" />
    <meta property="og:description" content="Integra Networks delivers fast, reliable internet where fibre can&#39;t reach. SD-WAN, Starlink, leased lines, business WiFi, and managed connectivity — live in 14 days." />
    <meta property="og:image" content="https://integra-networks.co.uk/og-image.png" />
    <meta property="og:site_name" content="Integra Networks" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://integra-networks.co.uk" />
    <meta name="twitter:title" content="Integra Networks — Business-Grade Connectivity Without Fibre" />
    <meta name="twitter:description" content="Integra Networks delivers fast, reliable internet where fibre can&#39;t reach. SD-WAN, Starlink, leased lines, business WiFi, and managed connectivity — live in 14 days." />
    <meta name="twitter:image" content="https://integra-networks.co.uk/og-image.png" />

    <script>
      (() => {
        const siteUrl = "https://integra-networks.co.uk";
        const path = window.location.pathname === "/" ? "" : window.location.pathname.replace(/\/$/, "");
        const canonicalUrl = `${siteUrl}${path}`;
        const routeMeta = {
          "/integra-sd-wan": {
            title: "Integra SD-WAN | Fast Internet Without Fibre | Integra Networks",
            description: "Tired of waiting for fibre? Enjoy fast internet in under 14 days. With 99% UK Coverage, Integra can transform your connectivity. Stop waiting for Fibre and go live with Integra.",
          },
        }[path];

        const upsertLink = (rel, href) => {
          let tag = document.head.querySelector(`link[rel="${rel}"]`);
          if (!tag) {
            tag = document.createElement("link");
            tag.setAttribute("rel", rel);
            document.head.appendChild(tag);
          }
          tag.setAttribute("href", href);
        };

        const upsertMeta = (selector, attr, key, content) => {
          let tag = document.head.querySelector(selector);
          if (!tag) {
            tag = document.createElement("meta");
            tag.setAttribute(attr, key);
            document.head.appendChild(tag);
          }
          tag.setAttribute("content", content);
        };

        upsertLink("canonical", canonicalUrl);
        upsertMeta('meta[property="og:url"]', "property", "og:url", canonicalUrl);
        upsertMeta('meta[name="twitter:url"]', "name", "twitter:url", canonicalUrl);

        if (routeMeta) {
          document.title = routeMeta.title;
          upsertMeta('meta[name="description"]', "name", "description", routeMeta.description);
          upsertMeta('meta[property="og:title"]', "property", "og:title", routeMeta.title);
          upsertMeta('meta[property="og:description"]', "property", "og:description", routeMeta.description);
          upsertMeta('meta[name="twitter:title"]', "name", "twitter:title", routeMeta.title);
          upsertMeta('meta[name="twitter:description"]', "name", "twitter:description", routeMeta.description);
        }
      })();
    </script>

    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Integra Networks",

      "logo": "https://integra-networks.co.uk/favicon.png",
      "description": "Business-grade connectivity solutions for UK businesses. SD-WAN, Starlink, leased lines, 4G/5G bonding, and managed WiFi — installed in 10 working days.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "GB"
      },
      "sameAs": [
        "https://www.linkedin.com/company/integra-networks"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "sales",
        "url": "https://integra-networks.co.uk/contact"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Integra Networks",
      "url": "https://integra-networks.co.uk"
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
